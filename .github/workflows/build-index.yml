name: Build subscription

# Rebuilds index.json from sources.txt and signs it.
#
# The index is derived data: it is discarded and regenerated on every run, so a plugin
# repository that publishes a new release or changes a description appears here on the
# next build without anyone editing this repository.

on:
  push:
    branches: ['main']
    paths: ['sources.txt', 'collection.json', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-subscription
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the signer against RFC 8032
        run: |
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "scripts")
          import build_index as build

          seed = bytes.fromhex("9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60")
          public = "d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a"
          signature = ("e5564300c360ac729086e2cc806e828a84877f1eb8e5d974d873e06522490155"
                       "5fb8821590a33bacc61e39701cf9b46bd25bf5f0595bbe24655141438e7a100b")
          assert build.public_from_seed(seed).hex() == public, "public key derivation drifted"
          assert build.sign(b"", seed).hex() == signature, "signature drifted"
          print("signer matches RFC 8032 vector 1")
          PY

      - name: Build and sign the index
        env:
          EVILO_SUBSCRIBE_KEY_HEX: ${{ secrets.EVILO_SUBSCRIBE_KEY_HEX }}
        run: |
          test -n "$EVILO_SUBSCRIBE_KEY_HEX" || { echo 'Configure the EVILO_SUBSCRIBE_KEY_HEX secret.'; exit 1; }
          python3 scripts/build_index.py

      - name: Publish the index and its pointer
        run: |
          set -euo pipefail
          git config user.name 'evilo subscribe'
          git config user.email 'subscribe@users.noreply.github.com'
          git add index.json index.json.sig index.json.pub repo.json
          if git diff --cached --quiet; then
            echo 'Index unchanged; nothing to publish.'
            exit 0
          fi
          git commit -m "chore(index): rebuild from sources.txt"
          git push
